name: Publish prerelease

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact CI-verified commit to publish.
        required: true
        type: string
      expected_version:
        description: Exact prerelease version to publish, for example 2.0.0-alpha.1.
        required: true
        type: string

concurrency:
  group: publish-prerelease
  cancel-in-progress: false

# The npm trusted publisher must identify this exact repository and workflow.
# The protected `npm` environment is the approval boundary for the publish job.
permissions:
  contents: read
  actions: read

env:
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  EMBLOR_EXPECTED_VERSION: ${{ inputs.expected_version }}

jobs:
  validate:
    name: Validate exact prerelease candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    steps:
      - name: Checkout the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify the exact candidate is on main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          [[ "$EXPECTED_VERSION" =~ ^2\.0\.0-alpha\.[0-9]+$ ]]
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Require a successful exact-SHA CI run
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.inputs.expected_sha;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              per_page: 100,
            });
            const passingRun = response.data.workflow_runs.find((run) => run.conclusion === 'success');
            if (!passingRun) {
              core.setFailed(`No successful CI workflow run exists for ${sha}.`);
              return;
            }
            core.info(`Using successful CI run ${passingRun.id} for ${sha}.`);

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run the complete distribution gate
        run: pnpm run distribution -- --skip-install

      - name: Install Chromium and run the browser gate
        run: |
          pnpm -C packages/emblor exec playwright install --with-deps chromium
          pnpm -C packages/emblor run test:browser

      - name: Validate prerelease metadata and npm preflight
        run: pnpm run release:dry-run

      - name: Pack the verified candidate once
        id: candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/emblor-alpha"
          mkdir -p "$artifact_dir"
          npm pack . --pack-destination "$artifact_dir" --ignore-scripts
          tarball="$artifact_dir/emblor-${EXPECTED_VERSION}.tgz"
          test -f "$tarball"
          (cd "$artifact_dir" && sha256sum "emblor-${EXPECTED_VERSION}.tgz" > tarball.sha256)
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const [sha256Line] = readFileSync(process.argv[1], 'utf8').trim().split(/\\r?\\n/); writeFileSync(process.argv[2], JSON.stringify({ commit: process.env.EXPECTED_SHA, version: process.env.EXPECTED_VERSION, tarball: 'emblor-' + process.env.EXPECTED_VERSION + '.tgz', sha256: sha256Line.split(/\\s+/)[0] }, null, 2) + '\\n');" "$artifact_dir/tarball.sha256" "$artifact_dir/candidate.json"
          echo "artifact_name=emblor-prerelease-candidate-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
        working-directory: packages/emblor

      - name: Upload the exact candidate tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/emblor-alpha
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified prerelease through npm OIDC
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/emblor/v/${{ inputs.expected_version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Download the validated candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: alpha-candidate

      - name: Verify candidate identity and npm toolchain
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_INPUT_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          test "$EXPECTED_INPUT_VERSION" = "$EXPECTED_VERSION"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { execFileSync } from 'node:child_process'; const candidate = JSON.parse(readFileSync('alpha-candidate/candidate.json', 'utf8')); if (candidate.commit !== process.env.EXPECTED_SHA || candidate.version !== process.env.EXPECTED_VERSION) throw new Error('Candidate identity mismatch'); const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('Trusted publishing requires npm >= 11.5.1');"
          tarball="alpha-candidate/emblor-${EXPECTED_VERSION}.tgz"
          test -f "$tarball"
          (cd alpha-candidate && sha256sum --check tarball.sha256)

      - name: Assert the registry is still safe to publish
        run: node scripts/validate-alpha-registry.mjs --prepublish

      - name: Publish the verified tarball to npm `next` with provenance
        run: npm publish "./alpha-candidate/emblor-${EXPECTED_VERSION}.tgz" --tag next --access public --provenance --ignore-scripts

      - name: Verify npm publication before any Git metadata action
        run: node scripts/validate-alpha-registry.mjs --published

      - name: Verify published npm metadata and provenance
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          npm view "emblor@${EXPECTED_VERSION}" dist --json > "$RUNNER_TEMP/emblor-dist.json"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const dist = JSON.parse(readFileSync(process.argv[1], 'utf8')); if (!dist.integrity || !dist.tarball || !dist.attestations?.url || dist.attestations.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') throw new Error('Published npm metadata is missing integrity, tarball, or SLSA provenance.');" "$RUNNER_TEMP/emblor-dist.json"

      - name: Verify published React 18 and React 19 consumers
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/emblor-published-consumer"
          mkdir -p "$consumer_dir"
          npm pack "emblor@${EXPECTED_VERSION}" --pack-destination "$consumer_dir" --ignore-scripts
          EMBLOR_TARBALL="$consumer_dir/emblor-${EXPECTED_VERSION}.tgz" node packages/emblor/tests/compat/verify-packed-consumers.mjs

      # Git tag and GitHub prerelease creation are separate Phase 4 actions after
      # the registry checks above have been reviewed.
