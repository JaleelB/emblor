name: CC

on:
  pull_request:
    branches: ['*']

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.2

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install deps (with cache)
        run: pnpm install --frozen-lockfile

      - name: Verify external website package
        run: pnpm -C website run verify:consumer

      - name: Validate website content and registry
        run: pnpm -C website run validate:content && pnpm -C website run validate:docs-code && pnpm -C website run validate:api-docs && pnpm -C website run validate:behavior-docs && pnpm -C website run validate:registry

      - name: Build website
        run: pnpm -C website run build

      - name: Start website registry server
        run: |
          pnpm -C website start --hostname 127.0.0.1 --port 4501 > website-registry.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4501/r/index.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat website-registry.log
          exit 1

      - name: Test hosted registry in a clean consumer
        env:
          REGISTRY_BASE_URL: http://127.0.0.1:4501
        run: pnpm -C website run test:registry-consumer

      - name: Install website browsers
        run: pnpm -C website exec playwright install --with-deps chromium firefox webkit

      - name: Run website browser gate
        run: pnpm -C website run test:browser

      - name: Lint website
        run: pnpm -C website run lint

      - name: Check website format
        run: pnpm -C website run format:check

      - name: Run typecheck in website workspace
        run: pnpm -C website run typecheck

      - name: Run typecheck in package workspace
        run: pnpm -C packages/emblor run typecheck

      - name: Run package tests
        run: pnpm -C packages/emblor run test

      - name: Check prettier format
        run: pnpm run prettier-check

      - name: Build packages
        run: pnpm run build --filter "./packages/*"
